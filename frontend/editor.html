<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TIME | Editor</title>

  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <div class="editor-page">
    <header class="app-header">
      <button id="backButton" class="back-button" type="button">
        ← 뒤로가기
      </button>

      <div class="app-title">TIME</div>
      <div class="app-credit">Made by Songpyo Hong</div>
    </header>

    <main class="editor-main">
      <section class="editor-toolbar">
        <div class="toolbar-left">
          <h1 class="page-title">데이터 편집 및 이상탐지 설정</h1>
          <p class="page-description">
            CSV 데이터를 직접 수정한 뒤, 다변량 시계열 이상탐지를 실행하세요.
            숫자형 컬럼 전체를 기준으로 anomaly score, 이상 시점, 변수별 기여도를 계산합니다.
          </p>
        </div>

        <div class="toolbar-right">
          <div class="toolbar-option-row">
            <div id="anomalyOptionPanel" class="anomaly-option-panel">
              <label for="anomalyMethodSelect" class="select-field">
                <span>탐지 방식</span>
                <select id="anomalyMethodSelect">
                  <option value="auto" selected>Auto</option>
                  <option value="isolation_forest">Isolation Forest</option>
                  <option value="zscore">Z-score</option>
                  <option value="iqr">IQR</option>
                  <option value="stl_residual">STL Residual</option>
                </select>
              </label>

              <label for="anomalySensitivitySelect" class="select-field">
                <span>민감도</span>
                <select id="anomalySensitivitySelect">
                  <option value="low">낮음</option>
                  <option value="medium" selected>보통</option>
                  <option value="high">높음</option>
                </select>
              </label>
            </div>
          </div>

          <div class="editor-action-group">
            <button
              id="addRowButton"
              class="tool-button action-group-button"
              type="button"
            >
              행 추가
            </button>

            <button
              id="addColumnButton"
              class="tool-button action-group-button"
              type="button"
            >
              열 추가
            </button>

            <button
              id="specialModeButton"
              class="tool-button action-group-button"
              type="button"
            >
              특이치 설정
            </button>

            <button
              id="runAnalysisButton"
              class="primary-button action-group-button"
              type="button"
            >
              이상탐지 실행
            </button>
          </div>
        </div>
      </section>

      <section class="table-section">
        <div class="table-guide">
          <span>셀과 컬럼명을 직접 클릭해서 수정할 수 있습니다.</span>
          <span>특이치 설정 버튼을 누른 뒤 셀을 클릭하면 분석에서 보호할 수 있습니다.</span>
        </div>

        <div class="table-wrapper">
          <table id="dataTable" class="data-table">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>

      <p id="editorStatus" class="editor-status"></p>

      <!-- 기존 코드 호환용 숨김 요소 -->
      <div class="legacy-compat-panel" hidden>
        <button
          id="forecastModeButton"
          class="mode-button"
          type="button"
          data-mode="forecast"
        >
          예측
        </button>

        <button
          id="anomalyModeButton"
          class="mode-button active"
          type="button"
          data-mode="anomaly"
        >
          이상탐지
        </button>

        <div id="horizonPanel" class="horizon-field">
          <label for="horizonInput">
            <span>시평</span>
            <input
              id="horizonInput"
              type="number"
              min="1"
              value="12"
            />
          </label>

          <label class="auto-horizon-field">
            <input
              id="autoHorizonInput"
              type="checkbox"
            />
            <span>Test 데이터 길이와 동일</span>
          </label>
        </div>
      </div>
    </main>
  </div>

  <script src="./js/storage.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/editor.js"></script>
</body>
</html>
